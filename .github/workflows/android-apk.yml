name: Build ZCode Remote APK

on:
  push:
    branches: [main]
    paths:
      - "packages/android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "packages/android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # ZCode 客户端使用 Node 24.14.0；这里只构建 Android 子工程，但仍固定 runner
    runs-on: ubuntu-latest
    timeout-minutes: 40

    defaults:
      run:
        working-directory: packages/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 仓库体积较大且其余 workspace 与 Android 构建无关，只取子工程。
          sparse-checkout: packages/android
          sparse-checkout-cone-mode: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # build.gradle.kts 用 compileSdk { release(36) { minorApiLevel = 1 } }，
      # 需要 minor 版本 android-36.1；buildToolsVersion 固定 36.1.0。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36.1" \
            "build-tools;36.1.0" \
            "platform-tools"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Verify toolchain
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
          ls -l gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # 未配置 signingConfig，release 产出 app-release-unsigned.apk，安装前需自行签名
      - name: Build release APK (unsigned)
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          find app/build/outputs/apk -name "*.apk" -exec cp {} "$RUNNER_TEMP/apk/" \;
          ls -lh "$RUNNER_TEMP/apk"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: zcode-remote-apk
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Gradle test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: |
            packages/android/app/build/reports/**
            packages/android/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
